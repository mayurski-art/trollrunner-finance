<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://mayurski-art.github.io https://trollrunner.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://tjsyhfplxjtakdfkpdtg.supabase.co wss://tjsyhfplxjtakdfkpdtg.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Troll Runner Finance Admin</title>
<style>
:root {
  --bg: #060a07;
  --panel: #0d1510;
  --line: rgba(126, 255, 142, 0.25);
  --text: #dcffe3;
  --muted: #8dbb97;
  --accent: #7eff8e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  color: var(--text);
  background:
    radial-gradient(circle at top, rgba(126, 255, 142, 0.1), transparent 32%),
    linear-gradient(180deg, #070b08, #020402 58%);
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 28px 18px 42px;
}
.topbar,
.panel {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(15, 24, 17, 0.95), rgba(7, 11, 8, 0.95));
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 18px;
  flex-wrap: wrap;
}
.topbar h1 {
  margin: 0 0 6px;
  font-size: 24px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.topbar p {
  margin: 0;
  color: var(--muted);
  line-height: 1.6;
  font-size: 13px;
}
.top-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.button,
button {
  font: inherit;
  border: 1px solid rgba(126, 255, 142, 0.35);
  border-radius: 999px;
  background: rgba(126, 255, 142, 0.12);
  color: var(--text);
  padding: 10px 15px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.button:hover,
button:hover {
  background: rgba(126, 255, 142, 0.2);
}
.button-secondary {
  background: rgba(255, 255, 255, 0.04);
}
.panel {
  margin-top: 16px;
  padding: 18px;
  color: var(--muted);
  line-height: 1.6;
  font-size: 13px;
}
</style>
</head>
<body>
  <div class="wrap">
    <section class="topbar">
      <div>
        <h1>Finance Admin</h1>
        <p>No admin tools are currently configured for this site.</p>
      </div>
      <div class="top-actions">
        <a class="button button-secondary" href="index.html">Open Finance Site</a>
        <button id="logout-btn" class="button-secondary" type="button">Log Out</button>
      </div>
    </section>
    <section class="panel">
      There is nothing to manage here right now.
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3" integrity="sha384-uVefCux0Kf6w34gQVv8+jUPUwvwFUdnrcwI1kOJHs7sfPPXdDDucwcrPrppD6oUe" crossorigin="anonymous"></script>
  <script src="assets/js/site-lock.js"></script>
  <script src="assets/js/admin-auth.js"></script>
  <script>
    const AUTH_KEY = "trollrunner_finance_admin_auth";

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem(AUTH_KEY);
      window.location.href = "index.html";
    });

    (async () => {
      const helper = window.TrollrunnerAdminAuth;
      if (helper?.awaitPasswordRecoverySettled) await helper.awaitPasswordRecoverySettled();
      const authed = helper?.hasAdminSession ? await helper.hasAdminSession() : false;
      if (!authed) {
        localStorage.removeItem(AUTH_KEY);
        window.location.href = "index.html";
        return;
      }
      localStorage.setItem(AUTH_KEY, "1");
    })();
  </script>
</body>
</html>
